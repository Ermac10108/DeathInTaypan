
# The actual rifles
- type: entity
  name: NCWL SV-79 7.62x39mm
  parent: BaseWeaponRifle
  id: CrescentWeaponRifleSV79
  description: A unique bullpup design, produced by the Union Foundry in Chengridz. Designed with CQB in mind, the bullpup configuration allows for a long barrel in a stout package, at the cost of complicating the internal machinery. Chambered in 7.62x39mm Union.
  components:
  - type: Item
    shape:
    - 0,0,4,1
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/RIFLE/SV-79.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/RIFLE/SV-79.rsi
  - type: Gun
    fireRate: 6.5
    soundGunshot:
      path: /Audio/_Crescent/Weapons/Guns/rifle_2/rifle_gunshot_2.ogg
  - type: ChamberMagazineAmmoProvider
    boltClosed: null # means the bolt doesnt lock back like M16 pattern rifles, also means you need to cycle the gun after an empty mag
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CrescentMagazine_762x39
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - CrescentMagazine_762x39
      gun_chamber:
        name: Chamber
        startingItem: CrescentCartridge_762x39
        priority: 1
        whitelist:
          tags:
            - CrescentCartridge_762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 3000

- type: entity
  name: CZ OBJ-201 5.45x39
  parent: BaseWeaponRifle
  id: CrescentWeaponRifleOBJ201
  description: The OBJ-201 is the newest assault rifle designed by the NCWL, and is designed to eventually become the standard service rifle of the Homeguard. Designed off of an Old Earth design used by previous communists, the 201 is designed to make every man a marksman. The integrated optic makes target acqusition easy, and the two round "hyper burst" fires rounds before the recoil can affect the shooter. These are currently only issued to Spetsnaz units as field testing. Chambered in 5.45x39mm Union.
  components:
  - type: Item
    shape:
    - 0,0,4,1
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/RIFLE/OBJ-201.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/RIFLE/OBJ-201.rsi
  - type: Gun
    fireRate: 6.5
    selectedMode: Burst
    availableModes:
      - SemiAuto
      - Burst
    shotsPerBurst: 2
    burstFireRate: 18
    burstCooldown: 0.5
    soundGunshot:
      path: /Audio/_Crescent/Weapons/Guns/rifle_2/rifle_gunshot_2.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CrescentMagazine_545x39
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - CrescentMagazine_545x39
      gun_chamber:
        name: Chamber
        startingItem: CrescentCartridge_545x39
        priority: 1
        whitelist:
          tags:
            - CrescentCartridge_545x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 3000


